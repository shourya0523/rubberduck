<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rubber Duck — Explain</title>
  <style>
    :root {
      --paper: #f3ede3;
      --paper-deep: #e7dfd2;
      --ink: #1c2428;
      --ink-soft: rgba(28, 36, 40, 0.62);
      --ink-faint: rgba(28, 36, 40, 0.42);
      --lamp: #f2d7a0;
      --lamp-hot: #efc46a;
      --desk: #3d5c63;
      --desk-deep: #2a4147;
      --duck: #e6b422;
      --duck-deep: #c99512;
      --ok: #2f6b4f;
      --bad: #9b3b3b;
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --font-body: "Avenir Next", Avenir, "Century Gothic", Candara, "Segoe UI", sans-serif;
      --hold-ms-base: 1000ms;
      --hold-ms-thinking: 1600ms;
      --hold-ms-excited: 1000ms;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      color: var(--ink);
      font-family: var(--font-body);
      background: var(--desk-deep);
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse 85% 70% at 50% 38%, rgba(242, 215, 160, 0.55), transparent 58%),
        radial-gradient(ellipse 120% 55% at 50% 100%, rgba(42, 65, 71, 0.95), transparent 55%),
        linear-gradient(180deg, #d9cbb5 0%, var(--paper) 38%, var(--paper-deep) 62%, var(--desk) 100%);
    }

    body.listening {
      background:
        radial-gradient(ellipse 90% 75% at 50% 36%, rgba(239, 196, 106, 0.72), transparent 60%),
        radial-gradient(ellipse 120% 55% at 50% 100%, rgba(42, 65, 71, 0.95), transparent 55%),
        linear-gradient(180deg, #e2d0ae 0%, var(--paper) 38%, var(--paper-deep) 62%, var(--desk) 100%);
      transition: background 0.35s ease;
    }

    body.waiting {
      background:
        radial-gradient(ellipse 70% 55% at 50% 40%, rgba(180, 200, 205, 0.35), transparent 55%),
        radial-gradient(ellipse 120% 55% at 50% 100%, rgba(42, 65, 71, 0.95), transparent 55%),
        linear-gradient(180deg, #cfc6b8 0%, var(--paper-deep) 40%, #d5cdc0 62%, var(--desk-deep) 100%);
    }

    .world {
      min-height: 100dvh;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      position: relative;
    }

    .top {
      z-index: 3;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.15rem 1.4rem 0.35rem;
      animation: rise 0.65s ease both;
    }

    .brand {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 4.8vw, 2.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.95;
      color: var(--ink);
    }

    .mode {
      margin: 0.2rem 0 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .phase {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .phase-dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--ink-faint);
    }
    .phase-dot.listening { background: var(--duck-deep); }
    .phase-dot.waiting { background: var(--desk); }
    .phase-dot.error { background: var(--bad); }

    .duck-stage {
      position: relative;
      z-index: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .duck-frame {
      position: relative;
      width: min(92vw, 980px);
      height: min(58dvh, 560px);
    }

    .duck-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 18px 36px rgba(28, 36, 40, 0.22));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .duck-frame img.show { opacity: 1; }

    .words {
      z-index: 2;
      width: min(100%, 40rem);
      margin: 0 auto;
      padding: 0 1.25rem 0.35rem;
      text-align: center;
      animation: rise 0.75s 0.05s ease both;
    }

    .invite {
      margin: 0 0 0.65rem;
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 2.6vw, 1.45rem);
      font-weight: 600;
      color: var(--ink-soft);
      line-height: 1.35;
    }
    .invite.hide { display: none; }

    .you-block {
      margin: 0 0 0.55rem;
      font-size: clamp(1.05rem, 2.3vw, 1.3rem);
      font-weight: 600;
      line-height: 1.4;
      color: var(--ink);
      min-height: 1.4em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .you-block:empty { display: none; }
    .you-block.interim {
      color: var(--ink-soft);
      font-style: italic;
      font-weight: 500;
    }

    .nudge {
      margin: 0 auto;
      max-width: 34rem;
      font-size: 0.98rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink-faint);
      min-height: 1.35em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .nudge:empty { min-height: 0; }
    .nudge.streaming::after {
      content: " ·";
      color: var(--duck-deep);
      animation: blink 1s steps(1) infinite;
    }

    .bottom {
      z-index: 3;
      padding: 0.5rem 1rem 1.25rem;
      display: grid;
      justify-items: center;
      gap: 0.55rem;
      background: linear-gradient(180deg, transparent, rgba(42, 65, 71, 0.18) 40%, rgba(42, 65, 71, 0.35));
      animation: rise 0.8s 0.08s ease both;
    }

    .hold {
      appearance: none;
      border: 0;
      width: min(92vw, 22rem);
      min-height: 3.6rem;
      padding: 0.85rem 1.25rem;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 10px 28px rgba(28, 36, 40, 0.22);
      transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .hold:hover { transform: translateY(-1px); }
    .hold:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .hold.armed {
      background: var(--duck-deep);
      color: var(--ink);
      box-shadow:
        0 0 0 6px rgba(230, 180, 34, 0.28),
        0 12px 32px rgba(28, 36, 40, 0.2);
    }

    .hold-hint {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(243, 237, 227, 0.82);
      text-align: center;
    }

    .secondary {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .linkish {
      appearance: none;
      border: 0;
      background: transparent;
      color: rgba(243, 237, 227, 0.78);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 0.18em;
      cursor: pointer;
      padding: 0.2rem;
    }
    .linkish:hover { color: var(--lamp-hot); }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: rgba(28, 36, 40, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .scrim.show { opacity: 1; pointer-events: auto; }

    .sheet, .log {
      position: fixed;
      z-index: 6;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 -16px 48px rgba(28, 36, 40, 0.28);
      transition: transform 0.28s ease;
    }

    .sheet {
      left: 50%;
      bottom: 0;
      width: min(100%, 420px);
      transform: translate(-50%, 110%);
      border-radius: 1rem 1rem 0 0;
      padding: 0.9rem 0.9rem 1.1rem;
      display: grid;
      gap: 0.55rem;
    }
    .sheet.open { transform: translate(-50%, 0); }

    .sheet textarea {
      width: 100%;
      min-height: 5rem;
      resize: vertical;
      border: 1px solid rgba(28, 36, 40, 0.18);
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.45);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      padding: 0.75rem 0.85rem;
      outline: none;
    }
    .sheet textarea:focus { border-color: rgba(230, 180, 34, 0.75); }

    .sheet-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.45rem;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 0.65rem;
      padding: 0.55rem 0.9rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.ghost { background: transparent; color: var(--ink-soft); }
    .btn.solid { background: var(--ink); color: var(--paper); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .log {
      top: 0;
      right: 0;
      width: min(100%, 360px);
      height: 100%;
      transform: translateX(105%);
      padding: 1rem 1rem 1.25rem;
      display: grid;
      grid-template-rows: auto 1fr;
      border-left: 1px solid rgba(28, 36, 40, 0.1);
    }
    .log.open { transform: translateX(0); }

    .log h2 {
      margin: 0 2rem 0.75rem 0;
      font-family: var(--font-display);
      font-size: 1.3rem;
    }

    .log-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .log-stream {
      overflow: auto;
      padding-right: 0.2rem;
    }

    .log-stream .you,
    .log-stream .duck {
      margin: 0 0 0.85rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .log-stream .you { color: var(--ink); }
    .log-stream .duck { color: var(--ink-soft); font-weight: 500; }
    .log-stream .label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 0.15rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 640px) {
      .top { padding: 0.9rem 1rem 0.2rem; }
      .duck-frame { height: min(48dvh, 420px); }
      .hold { min-height: 3.35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .duck-frame img { transition: none; }
      .nudge.streaming::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="world">
    <header class="top">
      <div>
        <h1 class="brand">Rubber Duck</h1>
        <p class="mode">Explain</p>
      </div>
      <div class="phase" id="phase">
        <span class="phase-dot" id="phaseDot" aria-hidden="true"></span>
        <span id="phaseText">The duck listens</span>
      </div>
    </header>

    <main class="duck-stage" aria-label="Rubber duck">
      <div class="duck-frame" id="duckFrame">
        <img id="poster-base" src="/assets/duck-base-poster.jpg" alt="" />
        <img id="poster-thinking" src="/assets/duck-thinking-poster.jpg" alt="" />
        <img id="poster-excited" src="/assets/duck-excited-poster.jpg" alt="" />
        <img id="anim-base" alt="" />
        <img id="anim-thinking" alt="" />
        <img id="anim-excited" alt="" />
      </div>
    </main>

    <section class="words" aria-live="polite">
      <p class="invite" id="invite">Explain the code out loud. The duck listens.</p>
      <p class="you-block" id="youLine"></p>
      <p class="nudge" id="nudgeLine"></p>
    </section>

    <footer class="bottom">
      <button type="button" class="hold" id="holdBtn">Hold to explain</button>
      <p class="hold-hint" id="holdHint">Press and hold · Space works too</p>
      <div class="secondary">
        <button type="button" class="linkish" id="typeOpen">Type instead</button>
        <button type="button" class="linkish" id="logOpen">Session log</button>
      </div>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="log" id="log" aria-label="Session log" hidden>
    <button type="button" class="log-close" id="logClose" aria-label="Close">×</button>
    <h2>Session</h2>
    <div class="log-stream" id="stream"></div>
  </aside>

  <div class="sheet" id="typeSheet" hidden>
    <textarea id="textInput" rows="4" placeholder="Explain what’s happening in the code…"></textarea>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="typeClose">Cancel</button>
      <button type="button" class="btn solid" id="sendBtn">Explain</button>
    </div>
  </div>

  <script>
    const STATES = ["base", "thinking", "excited"];
    const ANIM_MS = { base: 1000, thinking: 1600, excited: 1000 };

    const holdBtn = document.getElementById("holdBtn");
    const holdHint = document.getElementById("holdHint");
    const phaseText = document.getElementById("phaseText");
    const phaseDot = document.getElementById("phaseDot");
    const invite = document.getElementById("invite");
    const youLine = document.getElementById("youLine");
    const nudgeLine = document.getElementById("nudgeLine");
    const streamEl = document.getElementById("stream");
    const sendBtn = document.getElementById("sendBtn");
    const textInput = document.getElementById("textInput");
    const typeSheet = document.getElementById("typeSheet");
    const logEl = document.getElementById("log");
    const scrim = document.getElementById("scrim");

    let duckState = "base";
    let busy = false;
    let connected = false;
    let recognition = null;
    let listening = false;
    let micReady = false;
    let speechSupported = false;
    let holdPointerId = null;
    let animTimer = null;
    let logDuckBody = null;
    let finalBuffer = "";

    function setPhase(text, kind = "") {
      phaseText.textContent = text;
      phaseDot.className = "phase-dot" + (kind ? ` ${kind}` : "");
      document.body.classList.toggle("listening", kind === "listening");
      document.body.classList.toggle("waiting", kind === "waiting");
    }

    function setBusy(next) {
      busy = next;
      sendBtn.disabled = busy;
      textInput.disabled = busy;
      if (!listening) holdBtn.disabled = busy || !speechSupported;
    }

    function showPoster(state) {
      for (const s of STATES) {
        document.getElementById(`poster-${s}`).classList.toggle("show", s === state);
        document.getElementById(`anim-${s}`).classList.remove("show");
      }
    }

    function playStateAnim(state) {
      showPoster(state);
      const anim = document.getElementById(`anim-${state}`);
      // restart one-shot webp
      anim.classList.remove("show");
      anim.removeAttribute("src");
      void anim.offsetWidth;
      anim.src = `/assets/duck-${state}.webp?t=${Date.now()}`;
      anim.onload = () => {
        document.getElementById(`poster-${state}`).classList.remove("show");
        anim.classList.add("show");
      };
      clearTimeout(animTimer);
      animTimer = setTimeout(() => {
        anim.classList.remove("show");
        document.getElementById(`poster-${state}`).classList.add("show");
      }, ANIM_MS[state] + 80);
    }

    function setDuckState(state, { animate = true } = {}) {
      if (!STATES.includes(state)) return;
      const changed = state !== duckState;
      duckState = state;
      if (animate && changed) playStateAnim(state);
      else showPoster(state);
    }

    function hideInvite() {
      invite.classList.add("hide");
    }

    function setYouText(text, interim = false) {
      if (text) hideInvite();
      youLine.textContent = text || "";
      youLine.classList.toggle("interim", interim);
    }

    function setNudge(text, streaming = false) {
      nudgeLine.textContent = text || "";
      nudgeLine.classList.toggle("streaming", streaming);
    }

    function appendLogYou(text) {
      const p = document.createElement("p");
      p.className = "you";
      p.innerHTML = `<span class="label">You</span>${escapeHtml(text)}`;
      streamEl.appendChild(p);
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function ensureLogDuck() {
      if (logDuckBody) return logDuckBody;
      const p = document.createElement("p");
      p.className = "duck";
      p.innerHTML = `<span class="label">Duck</span><span class="body"></span>`;
      streamEl.appendChild(p);
      logDuckBody = p.querySelector(".body");
      streamEl.scrollTop = streamEl.scrollHeight;
      return logDuckBody;
    }

    function appendLogToken(text) {
      const body = ensureLogDuck();
      body.textContent += text;
      setNudge(body.textContent, true);
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function finishLogDuck() {
      if (logDuckBody) {
        setNudge(logDuckBody.textContent || "", false);
        logDuckBody = null;
      }
      nudgeLine.classList.remove("streaming");
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function openOverlay(el) {
      el.hidden = false;
      requestAnimationFrame(() => el.classList.add("open"));
      scrim.hidden = false;
      requestAnimationFrame(() => scrim.classList.add("show"));
    }

    function closeOverlay(el) {
      el.classList.remove("open");
      const done = () => {
        el.hidden = true;
        el.removeEventListener("transitionend", done);
      };
      el.addEventListener("transitionend", done);
      if (![typeSheet, logEl].some((x) => x.classList.contains("open") && x !== el)) {
        scrim.classList.remove("show");
        setTimeout(() => { if (!scrim.classList.contains("show")) scrim.hidden = true; }, 280);
      }
    }

    document.getElementById("typeOpen").addEventListener("click", () => {
      openOverlay(typeSheet);
      textInput.focus();
    });
    document.getElementById("typeClose").addEventListener("click", () => closeOverlay(typeSheet));
    document.getElementById("logOpen").addEventListener("click", () => openOverlay(logEl));
    document.getElementById("logClose").addEventListener("click", () => closeOverlay(logEl));
    scrim.addEventListener("click", () => {
      if (typeSheet.classList.contains("open")) closeOverlay(typeSheet);
      if (logEl.classList.contains("open")) closeOverlay(logEl);
    });

    async function sendUtterance(text) {
      const trimmed = String(text || "").trim();
      if (!trimmed || busy) return;
      closeOverlay(typeSheet);
      hideInvite();
      setYouText(trimmed, false);
      appendLogYou(trimmed);
      setNudge("");
      setBusy(true);
      setDuckState("thinking", { animate: true });
      setPhase("Waiting with the duck…", "waiting");
      try {
        const res = await fetch("/utterance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: trimmed }),
        });
        if (!res.ok) throw new Error("utterance failed");
      } catch (err) {
        setPhase(`Bridge offline — ${err.message}`, "error");
        setBusy(false);
        setDuckState("base", { animate: true });
        setNudge("(Couldn’t reach the bridge.)");
      }
    }

    function connectSSE() {
      const es = new EventSource("/events");
      es.onopen = () => {
        connected = true;
        if (!listening && !busy) setPhase("The duck listens");
      };
      es.onerror = () => {
        connected = false;
        setPhase("Reconnecting…", "error");
      };
      es.onmessage = (msg) => {
        let data;
        try { data = JSON.parse(msg.data); } catch { return; }
        const { type, text } = data;
        if (type === "hello") {
          connected = true;
          if (!listening && !busy) setPhase("The duck listens");
          return;
        }
        if (type === "state") {
          setDuckState(text || "base", { animate: true });
          return;
        }
        if (type === "token") {
          setBusy(true);
          setPhase("Waiting with the duck…", "waiting");
          appendLogToken(text || "");
          return;
        }
        if (type === "done") {
          finishLogDuck();
          if (text && STATES.includes(text)) setDuckState(text, { animate: true });
          else setDuckState("base", { animate: true });
          setBusy(false);
          setPhase("The duck listens");
          return;
        }
        if (type === "error") {
          finishLogDuck();
          setNudge(text || "Something went wrong");
          setBusy(false);
          setDuckState("base", { animate: true });
          setPhase("Error", "error");
        }
      };
    }

    async function ensureMic() {
      if (micReady) return true;
      if (!navigator.mediaDevices?.getUserMedia) {
        setPhase("Mic API missing — type instead", "error");
        return false;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((t) => t.stop());
        micReady = true;
        return true;
      } catch (err) {
        setPhase(`Mic blocked (${err.name}) — type instead`, "error");
        return false;
      }
    }

    function setupSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        speechSupported = false;
        holdBtn.disabled = true;
        holdBtn.textContent = "Mic unavailable";
        holdHint.textContent = "Use Type instead (Chrome/Edge recommended)";
        return;
      }
      speechSupported = true;
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = navigator.language || "en-US";

      recognition.onstart = () => {
        listening = true;
        finalBuffer = "";
        holdBtn.classList.add("armed");
        holdBtn.textContent = "Listening… release to send";
        setPhase("Listening", "listening");
      };

      recognition.onend = () => {
        const wasListening = listening;
        listening = false;
        holdBtn.classList.remove("armed");
        holdBtn.textContent = "Hold to explain";
        holdPointerId = null;
        if (!busy) setPhase("The duck listens");
        if (!wasListening) return;
        const toSend = finalBuffer.trim() || youLine.textContent.trim();
        finalBuffer = "";
        if (toSend) {
          setYouText(toSend, false);
          sendUtterance(toSend);
        } else {
          setYouText("", false);
        }
      };

      recognition.onerror = (e) => {
        listening = false;
        holdBtn.classList.remove("armed");
        holdBtn.textContent = "Hold to explain";
        if (e.error === "not-allowed") {
          setPhase("Mic permission denied — type instead", "error");
        } else if (e.error !== "aborted" && e.error !== "no-speech") {
          setPhase(`Mic: ${e.error}`, "error");
        }
      };

      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalBuffer += `${t} `;
          else interim += t;
        }
        const live = `${finalBuffer}${interim}`.trim();
        setYouText(live, Boolean(interim));
      };
    }

    async function startHold(pointerId) {
      if (busy || listening || !speechSupported) return;
      if (!(await ensureMic())) return;
      holdPointerId = pointerId ?? "keys";
      try {
        recognition.start();
      } catch {
        /* already started */
      }
    }

    function stopHold(pointerId) {
      if (!listening) return;
      if (holdPointerId != null && pointerId != null && holdPointerId !== pointerId && holdPointerId !== "keys") {
        return;
      }
      try { recognition.stop(); } catch { /* ignore */ }
    }

    holdBtn.addEventListener("pointerdown", (e) => {
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      holdBtn.setPointerCapture?.(e.pointerId);
      startHold(e.pointerId);
    });
    holdBtn.addEventListener("pointerup", (e) => stopHold(e.pointerId));
    holdBtn.addEventListener("pointercancel", (e) => stopHold(e.pointerId));
    holdBtn.addEventListener("lostpointercapture", (e) => stopHold(e.pointerId));

    window.addEventListener("keydown", (e) => {
      if (e.code !== "Space" || e.repeat) return;
      if (e.target !== document.body && e.target !== document.documentElement && e.target !== holdBtn) return;
      e.preventDefault();
      startHold("keys");
    });
    window.addEventListener("keyup", (e) => {
      if (e.code !== "Space") return;
      e.preventDefault();
      stopHold("keys");
    });

    sendBtn.addEventListener("click", () => {
      const v = textInput.value;
      textInput.value = "";
      sendUtterance(v);
    });
    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    // Initial still
    showPoster("base");
    setupSpeech();
    connectSSE();
  </script>
</body>
</html>
