<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>Rubber Duck — Explain</title>
  <style>
    /*
      Layout decision — atmospheric material background:
      Duck OS uses a high-contrast terminal grid and one pixel-art
      character anchor. The interface keeps debugging text primary.
    */
    :root {
      --bg-0: #07110f;
      --bg-1: #0b1d19;
      --warm: rgba(255, 183, 48, 0.11);
      --warm-hot: rgba(255, 183, 48, 0.2);
      --ink: #e8fff3;
      --ink-soft: #b6d8c7;
      --ink-faint: #729989;
      --ink-dark: #07110f;
      --accent: #ffbd3a;
      --accent-deep: #d88420;
      --bad: #ff6b65;
      --glass: #0d201b;
      --glass-strong: #081712;
      --glass-edge: #2a624f;
      --glass-edge-bright: #74e9b8;
      --shadow: 6px 6px 0 rgba(0, 0, 0, 0.42);
      --spring: steps(3, end);
      --spring-fast: steps(2, end);
      --font: "Courier New", "Lucida Console", Monaco, monospace;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      /* Vertical rhythm: chrome ~auto · duck ~1 · words ~0.7 · dock ~auto
         Streaming flips duck/words so the transcript becomes primary. */
      --row-duck: 1.35fr;
      --row-words: 0.55fr;
    }
    body.is-streaming {
      --row-duck: 0.55fr;
      --row-words: 1.35fr;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      color: var(--ink);
      font: 100%/1.45 var(--font);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      background: var(--bg-0);
    }

    body {
      background:
        radial-gradient(circle at 16% 20%, rgba(255, 189, 58, 0.16) 0 2px, transparent 2.5px),
        radial-gradient(circle at 82% 73%, rgba(116, 233, 184, 0.18) 0 1px, transparent 1.5px),
        repeating-linear-gradient(0deg, rgba(116, 233, 184, 0.055) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(116, 233, 184, 0.035) 0 1px, transparent 1px 18px),
        linear-gradient(135deg, #102c24 0%, #07110f 48%, #020706 100%);
      background-size: 117px 89px, 151px 113px, auto, auto, auto;
      transition: background 120ms steps(2, end);
    }
    body.listening {
      background:
        repeating-linear-gradient(0deg, rgba(255, 189, 58, 0.06) 0 1px, transparent 1px 4px),
        linear-gradient(135deg, #2b2410 0%, #0b1d19 50%, #030908 100%);
    }
    .world {
      min-height: 100dvh;
      height: 100%;
      display: grid;
      grid-template-rows:
        auto
        minmax(0, var(--row-duck))
        minmax(0, var(--row-words))
        auto;
      position: relative;
      isolation: isolate;
      padding:
        calc(0.45rem + var(--safe-t))
        1.1rem
        calc(0.55rem + var(--safe-b));
      gap: 0.7rem;
      max-width: 38rem;
      margin: 0 auto;
      transition: grid-template-rows 0.4s var(--spring);
    }

    /* ——— Floating chrome ——— */
    .chrome {
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 0.8rem;
      border-radius: 1rem;
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.22);
      animation: material-in 0.45s var(--spring) both;
    }

    .brand-block { min-width: 0; }
    .brand {
      margin: 0;
      font-size: clamp(1.2rem, 3.2vw, 1.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--ink);
    }
    .mode {
      margin: 0.18rem 0 0;
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .phase {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.38rem 0.7rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .phase-dot {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
      background: var(--ink-faint);
      flex: 0 0 auto;
    }
    .phase-dot.listening {
      background: var(--accent);
      box-shadow: 0 0 10px rgba(232, 180, 56, 0.65);
    }
    .phase-dot.waiting { background: rgba(245, 242, 234, 0.35); }
    .phase-dot.error { background: var(--bad); }

    /* ——— Duck stage (hero) ——— */
    .duck-stage {
      z-index: 1;
      min-height: 0;
      display: grid;
      place-items: end center;
      padding-bottom: 0.15rem;
      position: relative;
    }

    .duck-frame {
      position: relative;
      width: min(78vw, 390px);
      height: min(100%, 40dvh, 390px);
      transform-origin: 50% 80%;
      transition: width 0.4s var(--spring), height 0.4s var(--spring);
      filter: drop-shadow(0 28px 34px rgba(0, 0, 0, 0.42));
      animation: duck-in 0.55s var(--spring) both;
      will-change: width, height;
      -webkit-mask-image: radial-gradient(ellipse 70% 68% at 50% 52%, #000 38%, rgba(0,0,0,0.65) 58%, transparent 76%);
      mask-image: radial-gradient(ellipse 70% 68% at 50% 52%, #000 38%, rgba(0,0,0,0.65) 58%, transparent 76%);
    }
    body.is-streaming .duck-frame {
      width: min(48vw, 220px);
      height: min(100%, 20dvh, 220px);
    }
    .duck-frame {
      display: grid;
      place-items: center;
      mask-image: none;
      -webkit-mask-image: none;
      filter: drop-shadow(8px 8px 0 rgba(0, 0, 0, 0.42));
    }
    .pixel-duck {
      width: 176px;
      height: 150px;
      position: relative;
      image-rendering: pixelated;
      transform-origin: 50% 80%;
      scale: 1.25;
    }
    .duck-part { position: absolute; display: block; }
    .duck-body {
      left: 38px; top: 54px; width: 92px; height: 62px;
      background: #ffc73b;
      box-shadow: -12px 12px 0 #ffc73b, 12px 12px 0 #ffc73b, 0 24px 0 #f2a927;
    }
    .duck-head {
      left: 56px; top: 22px; width: 68px; height: 52px;
      background: #ffd95a;
      box-shadow: -12px 12px 0 #ffd95a, 12px 12px 0 #ffd95a, 0 -10px 0 #ffe992;
    }
    .duck-wing {
      left: 88px; top: 66px; width: 42px; height: 34px;
      background: #e89a20;
      box-shadow: 8px 8px 0 #c87516;
    }
    .duck-beak {
      left: 122px; top: 47px; width: 28px; height: 18px;
      background: #ff8e31;
      box-shadow: 8px 6px 0 #d75922;
    }
    .duck-eye {
      left: 100px; top: 38px; width: 10px; height: 10px;
      background: #092018;
      box-shadow: 2px 2px 0 #e8fff3;
    }
    .duck-leg {
      left: 62px; top: 124px; width: 16px; height: 10px;
      background: #ff8e31;
      box-shadow: 52px 0 0 #ff8e31, -8px 8px 0 #ff8e31, 52px 8px 0 #ff8e31;
    }
    .duck-bubble {
      position: absolute;
      top: -6px; right: -12px;
      max-width: 130px;
      padding: 8px 9px;
      color: #07110f;
      background: #b9ffdc;
      border: 3px solid #07110f;
      box-shadow: 4px 4px 0 #2a624f;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 100ms steps(2, end), transform 100ms steps(2, end);
    }
    .duck-bubble::after {
      content: "";
      position: absolute;
      left: 18px; bottom: -9px;
      width: 9px; height: 9px;
      background: #b9ffdc;
      border-right: 3px solid #07110f;
      border-bottom: 3px solid #07110f;
      transform: skewX(-35deg);
    }
    .duck-frame[data-state="thinking"] .duck-bubble,
    .duck-frame[data-state="excited"] .duck-bubble,
    .duck-frame[data-phase="listening"] .duck-bubble,
    .duck-frame[data-streaming="true"] .duck-bubble {
      opacity: 1;
      transform: translateY(0);
    }
    .duck-frame[data-state="thinking"] .pixel-duck { animation: duck-think 720ms steps(2, end) infinite; }
    .duck-frame[data-state="excited"] .pixel-duck { animation: duck-cheer 440ms steps(2, end) 2; }
    .duck-frame[data-phase="listening"] .pixel-duck { animation: duck-listen 300ms steps(2, end) infinite alternate; }

    /* ——— Transcript material ——— */
    .words {
      z-index: 2;
      min-height: 0;
      display: flex;
      flex-direction: column;
      animation: material-in 0.5s 0.04s var(--spring) both;
    }
    .words-panel {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0.85rem 1rem;
      border-radius: 1.15rem;
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      border-top-color: var(--glass-edge-bright);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      box-shadow: var(--shadow);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(245, 242, 234, 0.25) transparent;
      transition: background 0.25s ease;
    }
    body.is-streaming .words-panel {
      background: var(--glass-strong);
    }

    .invite {
      margin: 0;
      font-size: clamp(0.98rem, 2.1vw, 1.12rem);
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.35;
      color: var(--ink-soft);
    }
    .invite.hide { display: none; }

    .you-block {
      margin: 0;
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      font-weight: 650;
      letter-spacing: -0.012em;
      line-height: 1.4;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .you-block:empty { display: none; }
    .you-block.interim {
      color: var(--ink-soft);
      font-style: italic;
      font-weight: 500;
    }

    .nudge {
      margin: 0.55rem 0 0;
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink-faint);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .nudge:empty { display: none; margin: 0; }
    .nudge.streaming::after {
      content: " ·";
      color: var(--accent);
      animation: blink 1s steps(1) infinite;
    }

    /* ——— Dock ——— */
    .dock {
      z-index: 3;
      display: grid;
      gap: 0.4rem;
      justify-items: center;
      padding: 0.65rem 0.8rem 0.7rem;
      border-radius: 1.2rem;
      background: var(--glass-strong);
      border: 1px solid var(--glass-edge);
      border-top-color: var(--glass-edge-bright);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      box-shadow: 0 -8px 36px rgba(0, 0, 0, 0.28);
      animation: material-in 0.55s 0.06s var(--spring) both;
    }

    .hold {
      appearance: none;
      border: 0;
      width: min(100%, 20rem);
      min-height: 3.1rem;
      padding: 0.75rem 1.1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font: inherit;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: transform 100ms ease-out, background 0.15s ease, box-shadow 0.2s ease;
      will-change: transform;
    }
    /* Feedback on press, not release */
    .hold:active:not(:disabled) { transform: scale(0.97); }
    .hold:disabled { opacity: 0.42; cursor: not-allowed; }
    .hold.armed {
      background: var(--accent);
      color: var(--ink-dark);
      border-color: transparent;
      box-shadow: 0 0 0 6px rgba(232, 180, 56, 0.22);
      transform: scale(1.01);
    }
    .hold.armed:active { transform: scale(0.98); }

    .hold-hint {
      margin: 0;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--ink-faint);
    }

    .secondary {
      display: flex;
      gap: 1.1rem;
      align-items: center;
    }
    .linkish {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 0.18em;
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 0.35rem;
      transition: color 0.15s ease, transform 100ms ease-out;
    }
    .linkish:active { transform: scale(0.97); }
    .linkish:hover { color: var(--accent); }

    /* ——— Overlays / sheets ——— */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: rgba(8, 10, 12, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s var(--spring);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .scrim.show { opacity: 1; pointer-events: auto; }

    .sheet, .log {
      position: fixed;
      z-index: 6;
      background: rgba(28, 30, 36, 0.92);
      color: var(--ink);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-edge);
      /* presentation-value driven via --sheet-y */
      will-change: transform;
    }

    .sheet {
      left: 50%;
      bottom: 0;
      width: min(100%, 440px);
      --sheet-y: 110%;
      transform: translate(-50%, var(--sheet-y));
      border-radius: 1.25rem 1.25rem 0 0;
      padding: 0.45rem 0.95rem calc(1.1rem + var(--safe-b));
      display: grid;
      gap: 0.55rem;
      transition: transform 0.34s var(--spring);
      touch-action: none;
    }
    .sheet.open { --sheet-y: 0%; }
    .sheet.dragging { transition: none; }

    .sheet-handle {
      width: 2.4rem;
      height: 0.3rem;
      margin: 0.25rem auto 0.15rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .sheet textarea {
      width: 100%;
      min-height: 5.5rem;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      padding: 0.8rem 0.9rem;
      outline: none;
    }
    .sheet textarea:focus {
      border-color: rgba(232, 180, 56, 0.7);
      box-shadow: 0 0 0 4px rgba(232, 180, 56, 0.15);
    }

    .sheet-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.45rem;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 0.75rem;
      padding: 0.6rem 0.95rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 100ms ease-out, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn.ghost { background: transparent; color: var(--ink-soft); }
    .btn.solid { background: var(--accent); color: var(--ink-dark); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .log {
      top: 0;
      right: 0;
      width: min(100%, 360px);
      height: 100%;
      --log-x: 105%;
      transform: translateX(var(--log-x));
      padding: calc(1rem + var(--safe-t)) 1rem calc(1.25rem + var(--safe-b));
      display: grid;
      grid-template-rows: auto 1fr;
      border-left: 1px solid var(--glass-edge);
      border-radius: 1.1rem 0 0 1.1rem;
      transition: transform 0.36s var(--spring);
    }
    .log.open { --log-x: 0%; }

    .log h2 {
      margin: 0 2rem 0.75rem 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .log-close {
      position: absolute;
      top: calc(0.75rem + var(--safe-t));
      right: 0.75rem;
      appearance: none;
      border: 0;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      transition: transform 100ms ease-out;
    }
    .log-close:active { transform: scale(0.94); }

    .log-stream { overflow: auto; padding-right: 0.2rem; }
    .log-stream .you, .log-stream .duck {
      margin: 0 0 0.85rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .log-stream .you { color: var(--ink); }
    .log-stream .duck { color: var(--ink-soft); font-weight: 500; }
    .log-stream .label {
      display: block;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 0.15rem;
    }

    @keyframes material-in {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes duck-in {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes duck-think {
      50% { transform: translateX(6px) rotate(2deg); }
    }
    @keyframes duck-cheer {
      50% { transform: translateY(-14px) rotate(-4deg); }
    }
    @keyframes duck-listen {
      to { transform: translateY(-5px) scale(1.03, 0.97); }
    }

    /* ——— Duck OS terminal skin ——— */
    .world {
      max-width: 76rem;
      gap: 0.55rem;
    }
    .chrome, .words-panel, .dock, .sheet, .log {
      border-radius: 0;
      border: 2px solid var(--glass-edge);
      box-shadow: var(--shadow);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .chrome {
      padding: 0.7rem 0.8rem;
      background: var(--glass-strong);
      border-color: var(--glass-edge-bright);
    }
    .brand {
      color: var(--accent);
      font-size: clamp(1rem, 3vw, 1.3rem);
      letter-spacing: 0.08em;
      text-shadow: 2px 2px 0 #653b12;
    }
    .mode, .phase, .hold-hint, .linkish, .nudge, .log-stream .label {
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .phase {
      border-radius: 0;
      padding: 0.38rem 0.5rem;
      color: var(--ink-soft);
      background: #102c24;
      border-color: #2a624f;
      font-size: 0.66rem;
    }
    .phase-dot { border-radius: 0; }
    .phase-dot.listening {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(255, 189, 58, 0.75);
    }
    .duck-stage::before {
      content: "DUCK.OS // DEBUG COMPANION";
      position: absolute;
      inset: 0.1rem auto auto 50%;
      transform: translateX(-50%);
      color: var(--ink-faint);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      white-space: nowrap;
    }
    .duck-frame {
      width: min(78vw, 390px);
      height: min(100%, 40dvh, 390px);
      background:
        linear-gradient(90deg, transparent 49%, rgba(116, 233, 184, 0.1) 50%, transparent 51%),
        linear-gradient(0deg, rgba(116, 233, 184, 0.08) 1px, transparent 1px);
      background-size: 18px 18px;
      border-bottom: 3px solid #2a624f;
    }
    .words-panel {
      padding: 0.85rem 0.9rem;
      background: #091914;
      border-color: #2a624f;
      border-top-color: var(--glass-edge-bright);
    }
    .invite, .you-block, .nudge {
      font-family: var(--font);
      letter-spacing: 0.02em;
    }
    .invite::before { content: "> "; color: var(--accent); }
    .nudge.streaming::after { color: var(--accent); }
    .dock {
      padding: 0.65rem;
      background: #07130f;
      border-color: var(--glass-edge-bright);
    }
    .hold {
      border-radius: 0;
      min-height: 3.25rem;
      color: #07110f;
      background: var(--accent);
      border: 3px solid #ffe08b;
      box-shadow: 4px 4px 0 #8a4e13;
      font-family: var(--font);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .hold:hover:not(:disabled) { background: #ffd566; }
    .hold.armed {
      color: #07110f;
      background: #b9ffdc;
      border-color: #e8fff3;
      box-shadow: 0 0 0 4px rgba(185, 255, 220, 0.22), 4px 4px 0 #2a624f;
    }
    .linkish {
      color: var(--ink-soft);
      font-size: 0.72rem;
      text-decoration: none;
      border-bottom: 1px dashed var(--ink-faint);
    }
    .linkish:hover { color: var(--accent); }
    .sheet, .log {
      background: #071712;
      border-color: var(--glass-edge-bright);
    }
    .sheet textarea {
      border-radius: 0;
      border: 2px solid #2a624f;
      background: #06110e;
      font-family: var(--font);
      color: var(--ink);
    }
    .sheet textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 189, 58, 0.2);
    }
    .btn { border-radius: 0; font-family: var(--font); text-transform: uppercase; }
    .btn.solid { color: #07110f; background: var(--accent); }
    .log h2 { color: var(--accent); letter-spacing: 0.06em; }
    .log-close { border-radius: 0; background: #102c24; }

    @media (min-width: 780px) {
      .world {
        width: 100%;
        max-width: none;
        grid-template-columns: minmax(18rem, 0.9fr) minmax(28rem, 1.35fr) minmax(18rem, 0.9fr);
        grid-template-rows: auto minmax(0, 1fr);
        align-items: stretch;
        padding-inline: 1.35rem;
      }
      .chrome { grid-column: 1 / -1; grid-row: 1; }
      .duck-stage {
        grid-column: 1;
        grid-row: 2;
        min-height: 0;
        padding: 2rem 0.5rem 1rem;
        border: 2px solid #2a624f;
        background:
          linear-gradient(90deg, transparent 49%, rgba(116, 233, 184, 0.1) 50%, transparent 51%),
          linear-gradient(0deg, rgba(116, 233, 184, 0.08) 1px, transparent 1px),
          rgba(5, 20, 16, 0.78);
        background-size: 18px 18px;
      }
      .duck-frame {
        width: 100%;
        height: 100%;
        min-height: 25rem;
        border: 0;
        background: none;
      }
      .words { grid-column: 2; grid-row: 2; }
      .dock {
        grid-column: 3;
        grid-row: 2;
        align-content: center;
        padding: 1.25rem;
      }
      .hold { width: 100%; }
      body.is-streaming .duck-frame {
        width: 100%;
        height: 100%;
      }
      body.is-streaming .pixel-duck { scale: 1; }
      body.is-streaming .words-panel { border-color: var(--glass-edge-bright); }
    }

    @media (max-width: 640px) {
      :root {
        --row-duck: 1fr;
        --row-words: 0.85fr;
      }
      body.is-streaming {
        --row-duck: 0.55fr;
        --row-words: 1.25fr;
      }
      .world { padding-inline: 0.75rem; gap: 0.55rem; max-width: none; }
      .duck-frame {
        width: min(78vw, 300px);
        height: min(100%, 30dvh, 300px);
      }
      body.is-streaming .duck-frame {
        width: min(52vw, 200px);
        height: min(100%, 18dvh, 200px);
      }
      .chrome { padding: 0.5rem 0.7rem; }
      .brand { font-size: 1.15rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .duck-frame, .world { transition: none; }
      .nudge.streaming::after { animation: none; }
    }

    @media (prefers-reduced-transparency: reduce) {
      .chrome, .words-panel, .dock, .sheet, .log {
        background: #1c1f25;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      .scrim { backdrop-filter: none; -webkit-backdrop-filter: none; }
    }

    @media (prefers-contrast: more) {
      .chrome, .words-panel, .dock, .sheet, .log {
        background: #121418;
        border-color: rgba(245, 242, 234, 0.45);
      }
      .hold { border-color: rgba(245, 242, 234, 0.55); }
    }
  </style>
</head>
<body>
  <div class="world">
    <header class="chrome">
      <div class="brand-block">
        <h1 class="brand">Rubber Duck</h1>
        <p class="mode">Explain</p>
      </div>
      <div class="phase" id="phase">
        <span class="phase-dot" id="phaseDot" aria-hidden="true"></span>
        <span id="phaseText">The duck listens</span>
      </div>
    </header>

    <main class="duck-stage" aria-label="Rubber duck">
      <div class="duck-frame" id="duckFrame" role="img" aria-label="Animated pixel-art rubber duck" data-state="base" data-phase="idle">
        <div class="pixel-duck" aria-hidden="true">
          <span class="duck-bubble" id="duckBubble">QUACK?</span>
          <span class="duck-part duck-body"></span>
          <span class="duck-part duck-head"></span>
          <span class="duck-part duck-wing"></span>
          <span class="duck-part duck-beak"></span>
          <span class="duck-part duck-eye"></span>
          <span class="duck-part duck-leg"></span>
        </div>
      </div>
    </main>

    <section class="words" aria-live="polite">
      <div class="words-panel">
        <p class="invite" id="invite">Explain the code out loud. The duck listens.</p>
        <p class="you-block" id="youLine"></p>
        <p class="nudge" id="nudgeLine"></p>
      </div>
    </section>

    <footer class="dock">
      <button type="button" class="hold" id="holdBtn">Hold to explain</button>
      <p class="hold-hint" id="holdHint">Press and hold · Space works too</p>
      <div class="secondary">
        <button type="button" class="linkish" id="typeOpen">Type instead</button>
        <button type="button" class="linkish" id="logOpen">Session log</button>
      </div>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="log" id="log" aria-label="Session log" hidden>
    <button type="button" class="log-close" id="logClose" aria-label="Close">×</button>
    <h2>Session</h2>
    <div class="log-stream" id="stream"></div>
  </aside>

  <div class="sheet" id="typeSheet" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <textarea id="textInput" rows="4" placeholder="Explain what’s happening in the code…"></textarea>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="typeClose">Cancel</button>
      <button type="button" class="btn solid" id="sendBtn">Explain</button>
    </div>
  </div>

  <script>
    const STATES = ["base", "thinking", "excited"];
    const DUCK_BUBBLES = {
      base: "QUACK? DEBUG ME.",
      thinking: "HMM... COMPILING THOUGHTS",
      excited: "EUREKA! QUACK!",
    };

    const holdBtn = document.getElementById("holdBtn");
    const holdHint = document.getElementById("holdHint");
    const phaseText = document.getElementById("phaseText");
    const phaseDot = document.getElementById("phaseDot");
    const invite = document.getElementById("invite");
    const youLine = document.getElementById("youLine");
    const nudgeLine = document.getElementById("nudgeLine");
    const wordsPanel = document.querySelector(".words-panel");
    const streamEl = document.getElementById("stream");
    const duckFrame = document.getElementById("duckFrame");
    const duckBubble = document.getElementById("duckBubble");
    const sendBtn = document.getElementById("sendBtn");
    const textInput = document.getElementById("textInput");
    const typeSheet = document.getElementById("typeSheet");
    const logEl = document.getElementById("log");
    const scrim = document.getElementById("scrim");

    let duckState = "base";
    let busy = false;
    let connected = false;
    let recognition = null;
    let listening = false;
    let micReady = false;
    let speechSupported = false;
    let holdPointerId = null;
    let holdRequested = false;
    let logDuckBody = null;
    let finalBuffer = "";
    let nudgeRenderTimer = null;

    function setPhase(text, kind = "") {
      phaseText.textContent = text;
      phaseDot.className = "phase-dot" + (kind ? ` ${kind}` : "");
      document.body.classList.toggle("listening", kind === "listening");
      duckFrame.dataset.phase = kind || "idle";
    }

    function setBusy(next) {
      busy = next;
      sendBtn.disabled = busy;
      textInput.disabled = busy;
      if (!listening) holdBtn.disabled = busy || !speechSupported;
    }

    function setStreaming(on) {
      document.body.classList.toggle("is-streaming", on);
      duckFrame.dataset.streaming = String(on);
      if (on) duckBubble.textContent = "QUACKING BACK...";
      else duckBubble.textContent = DUCK_BUBBLES[duckState];
    }

    function scrollWordsToEnd() {
      if (!wordsPanel) return;
      wordsPanel.scrollTop = wordsPanel.scrollHeight;
    }

    function setDuckState(state, { animate = true } = {}) {
      if (!STATES.includes(state)) return;
      duckState = state;
      duckFrame.dataset.state = state;
      duckBubble.textContent = DUCK_BUBBLES[state];
    }

    function hideInvite() {
      invite.classList.add("hide");
    }

    function setYouText(text, interim = false) {
      if (text) hideInvite();
      youLine.textContent = text || "";
      youLine.classList.toggle("interim", interim);
      scrollWordsToEnd();
    }

    function setNudge(text, streaming = false) {
      nudgeLine.textContent = text || "";
      nudgeLine.classList.toggle("streaming", streaming);
      setStreaming(streaming && Boolean(text));
      scrollWordsToEnd();
    }

    function appendLogYou(text) {
      const p = document.createElement("p");
      p.className = "you";
      p.innerHTML = `<span class="label">You</span>${escapeHtml(text)}`;
      streamEl.appendChild(p);
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function ensureLogDuck() {
      if (logDuckBody) return logDuckBody;
      const p = document.createElement("p");
      p.className = "duck";
      p.innerHTML = `<span class="label">Duck</span><span class="body"></span>`;
      streamEl.appendChild(p);
      logDuckBody = p.querySelector(".body");
      streamEl.scrollTop = streamEl.scrollHeight;
      return logDuckBody;
    }

    function appendLogToken(text) {
      const body = ensureLogDuck();
      body.textContent += text;
      setStreaming(true);
      if (!nudgeRenderTimer) {
        nudgeRenderTimer = setTimeout(() => {
          nudgeRenderTimer = null;
          if (logDuckBody) setNudge(logDuckBody.textContent, true);
        }, 110);
      }
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function finishLogDuck() {
      clearTimeout(nudgeRenderTimer);
      nudgeRenderTimer = null;
      if (logDuckBody) {
        setNudge(logDuckBody.textContent || "", false);
        logDuckBody = null;
      }
      nudgeLine.classList.remove("streaming");
      setStreaming(false);
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function openOverlay(el) {
      el.hidden = false;
      requestAnimationFrame(() => el.classList.add("open"));
      scrim.hidden = false;
      requestAnimationFrame(() => scrim.classList.add("show"));
    }

    function closeOverlay(el) {
      el.classList.remove("open");
      const done = () => {
        el.hidden = true;
        el.removeEventListener("transitionend", done);
      };
      el.addEventListener("transitionend", done);
      if (![typeSheet, logEl].some((x) => x.classList.contains("open") && x !== el)) {
        scrim.classList.remove("show");
        setTimeout(() => { if (!scrim.classList.contains("show")) scrim.hidden = true; }, 300);
      }
    }

    /* Interruptible sheet drag — presentation value + velocity handoff */
    (function setupSheetDrag() {
      let dragging = false;
      let startY = 0;
      let startSheetY = 0;
      let lastY = 0;
      let lastT = 0;
      let velocity = 0;

      function sheetYPx() {
        const h = typeSheet.getBoundingClientRect().height || 1;
        const raw = getComputedStyle(typeSheet).getPropertyValue("--sheet-y").trim();
        if (raw.endsWith("%")) return (parseFloat(raw) / 100) * h;
        return parseFloat(raw) || 0;
      }

      function setSheetY(px) {
        const h = typeSheet.getBoundingClientRect().height || 1;
        const clamped = Math.max(0, px);
        typeSheet.style.setProperty("--sheet-y", `${(clamped / h) * 100}%`);
      }

      typeSheet.addEventListener("pointerdown", (e) => {
        if (!typeSheet.classList.contains("open")) return;
        if (e.target.closest("textarea, button, a")) return;
        dragging = true;
        typeSheet.classList.add("dragging");
        typeSheet.setPointerCapture(e.pointerId);
        startY = e.clientY;
        startSheetY = sheetYPx();
        lastY = e.clientY;
        lastT = performance.now();
        velocity = 0;
      });

      typeSheet.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const now = performance.now();
        const dy = e.clientY - startY;
        const next = startSheetY + Math.max(0, dy);
        // rubber-band slightly above 0 is unnecessary; resist only when pulling down past settle
        setSheetY(next);
        const dt = Math.max(1, now - lastT);
        velocity = ((e.clientY - lastY) / dt) * 1000;
        lastY = e.clientY;
        lastT = now;
      });

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        typeSheet.classList.remove("dragging");
        const h = typeSheet.getBoundingClientRect().height || 1;
        const y = sheetYPx();
        // Project momentum then snap (Apple-style)
        const projected = y + (velocity / 1000) * 0.998 / (1 - 0.998);
        const dismiss = velocity > 500 || projected > h * 0.32;
        if (dismiss) {
          typeSheet.style.setProperty("--sheet-y", "110%");
          closeOverlay(typeSheet);
          requestAnimationFrame(() => {
            typeSheet.style.removeProperty("--sheet-y");
          });
        } else {
          typeSheet.style.setProperty("--sheet-y", "0%");
          requestAnimationFrame(() => {
            typeSheet.style.removeProperty("--sheet-y");
          });
        }
      }

      typeSheet.addEventListener("pointerup", endDrag);
      typeSheet.addEventListener("pointercancel", endDrag);
    })();

    document.getElementById("typeOpen").addEventListener("click", () => {
      openOverlay(typeSheet);
      textInput.focus();
    });
    document.getElementById("typeClose").addEventListener("click", () => closeOverlay(typeSheet));
    document.getElementById("logOpen").addEventListener("click", () => openOverlay(logEl));
    document.getElementById("logClose").addEventListener("click", () => closeOverlay(logEl));
    scrim.addEventListener("click", () => {
      if (typeSheet.classList.contains("open")) closeOverlay(typeSheet);
      if (logEl.classList.contains("open")) closeOverlay(logEl);
    });

    async function sendUtterance(text) {
      const trimmed = String(text || "").trim();
      if (!trimmed || busy) return;
      closeOverlay(typeSheet);
      hideInvite();
      setYouText(trimmed, false);
      appendLogYou(trimmed);
      setNudge("");
      setBusy(true);
      setDuckState("thinking", { animate: true });
      setPhase("Waiting with the duck…", "waiting");
      try {
        const res = await fetch("/utterance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: trimmed }),
        });
        if (!res.ok) throw new Error("utterance failed");
      } catch (err) {
        setPhase(`Bridge offline — ${err.message}`, "error");
        setBusy(false);
        setDuckState("base", { animate: true });
        setNudge("(Couldn’t reach the bridge.)");
      }
    }

    function connectSSE() {
      const es = new EventSource("/events");
      es.onopen = () => {
        connected = true;
        if (!listening && !busy) setPhase("The duck listens");
      };
      es.onerror = () => {
        connected = false;
        setPhase("Reconnecting…", "error");
      };
      es.onmessage = (msg) => {
        let data;
        try { data = JSON.parse(msg.data); } catch { return; }
        const { type, text } = data;
        if (type === "hello") {
          connected = true;
          if (!listening && !busy) setPhase("The duck listens");
          return;
        }
        if (type === "state") {
          setDuckState(text || "base", { animate: true });
          return;
        }
        if (type === "token") {
          setBusy(true);
          setPhase("Waiting with the duck…", "waiting");
          appendLogToken(text || "");
          return;
        }
        if (type === "done") {
          finishLogDuck();
          if (text && STATES.includes(text)) setDuckState(text, { animate: true });
          else setDuckState("base", { animate: true });
          setBusy(false);
          setPhase("The duck listens");
          return;
        }
        if (type === "error") {
          finishLogDuck();
          setNudge(text || "Something went wrong");
          setBusy(false);
          setDuckState("base", { animate: true });
          setPhase("Error", "error");
        }
      };
    }

    async function ensureMic() {
      if (micReady) return true;
      if (!navigator.mediaDevices?.getUserMedia) {
        setPhase("Mic API missing — type instead", "error");
        return false;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((t) => t.stop());
        micReady = true;
        return true;
      } catch (err) {
        setPhase(`Mic blocked (${err.name}) — type instead`, "error");
        return false;
      }
    }

    function setupSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        speechSupported = false;
        holdBtn.disabled = true;
        holdBtn.textContent = "Mic unavailable";
        holdHint.textContent = "Use Type instead (Chrome/Edge recommended)";
        return;
      }
      speechSupported = true;
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = navigator.language || "en-US";

      recognition.onstart = () => {
        // Released during mic/start handshake — abort cleanly
        if (!holdRequested) {
          try { recognition.abort(); } catch { /* ignore */ }
          return;
        }
        listening = true;
        finalBuffer = "";
        holdBtn.classList.add("armed");
        holdBtn.textContent = "Listening… release to send";
        setPhase("Listening", "listening");
        if (typeof holdPointerId === "number") {
          try { holdBtn.setPointerCapture(holdPointerId); } catch { /* ignore */ }
        }
      };

      recognition.onend = () => {
        const wasListening = listening;
        listening = false;
        holdRequested = false;
        holdBtn.classList.remove("armed");
        holdBtn.textContent = "Hold to explain";
        holdPointerId = null;
        // Don't clobber a mic error phase set by onerror
        if (!busy && !phaseDot.classList.contains("error")) setPhase("The duck listens");
        if (!wasListening) return;
        const toSend = finalBuffer.trim() || youLine.textContent.trim();
        finalBuffer = "";
        if (toSend) {
          setYouText(toSend, false);
          sendUtterance(toSend);
        } else {
          setYouText("", false);
        }
      };

      recognition.onerror = (e) => {
        const hadListen = listening;
        listening = false;
        holdRequested = false;
        holdPointerId = null;
        holdBtn.classList.remove("armed");
        holdBtn.textContent = "Hold to explain";
        if (e.error === "not-allowed") {
          setPhase("Mic permission denied — type instead", "error");
        } else if (e.error === "audio-capture") {
          setPhase("Mic capture failed — type instead", "error");
        } else if (e.error !== "aborted" && e.error !== "no-speech") {
          setPhase(`Mic: ${e.error}`, "error");
        } else if (!hadListen && !busy) {
          setPhase("The duck listens");
        }
      };

      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalBuffer += `${t} `;
          else interim += t;
        }
        const live = `${finalBuffer}${interim}`.trim();
        setYouText(live, Boolean(interim));
      };
    }

    async function startHold(pointerId) {
      if (busy || listening || !speechSupported || holdRequested) return;
      holdRequested = true;
      holdPointerId = pointerId ?? "keys";
      if (!(await ensureMic())) {
        if (holdPointerId === (pointerId ?? "keys")) {
          holdRequested = false;
          holdPointerId = null;
        }
        return;
      }
      // User released while awaiting mic permission
      if (!holdRequested || holdPointerId !== (pointerId ?? "keys")) return;
      try {
        recognition.start();
      } catch {
        holdRequested = false;
        holdPointerId = null;
      }
    }

    function stopHold(pointerId) {
      if (holdPointerId != null && pointerId != null && holdPointerId !== pointerId && holdPointerId !== "keys") {
        return;
      }
      if (!listening) {
        // Cancel pending start (explicit release before recognition.onstart)
        holdRequested = false;
        holdPointerId = null;
        return;
      }
      holdRequested = false;
      try { recognition.stop(); } catch { /* ignore */ }
    }

    holdBtn.addEventListener("pointerdown", (e) => {
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      // Capture after recognition starts — early capture can fire lostpointercapture
      // during getUserMedia and cancel the pending hold.
      startHold(e.pointerId);
    });
    holdBtn.addEventListener("pointerup", (e) => stopHold(e.pointerId));
    holdBtn.addEventListener("pointercancel", (e) => stopHold(e.pointerId));
    holdBtn.addEventListener("lostpointercapture", (e) => {
      if (listening) stopHold(e.pointerId);
    });

    window.addEventListener("keydown", (e) => {
      if (e.code !== "Space" || e.repeat) return;
      if (e.target !== document.body && e.target !== document.documentElement && e.target !== holdBtn) return;
      e.preventDefault();
      startHold("keys");
    });
    window.addEventListener("keyup", (e) => {
      if (e.code !== "Space") return;
      e.preventDefault();
      stopHold("keys");
    });

    sendBtn.addEventListener("click", () => {
      const v = textInput.value;
      textInput.value = "";
      sendUtterance(v);
    });
    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    setDuckState("base", { animate: false });
    setupSpeech();
    connectSSE();
  </script>
</body>
</html>
