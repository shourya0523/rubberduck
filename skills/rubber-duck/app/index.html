<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rubber Duck</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/assets/vendor/three.module.js",
      "three/addons/loaders/GLTFLoader.js": "/assets/vendor/loaders/GLTFLoader.js"
    }
  }
  </script>
  <style>
    :root {
      --ink: #1a2a32;
      --muted: #3d5560;
      --foam: #f7fbfc;
      --duck: #f2c94c;
      --duck-deep: #e0a92a;
      --water: #2f6f7e;
      --water-deep: #1e4a56;
      --ripple: rgba(255, 255, 255, 0.35);
      --panel: rgba(247, 251, 252, 0.82);
      --danger: #b33a3a;
      --ok: #2f7d4a;
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --font-body: "Avenir Next", Avenir, "Century Gothic", Candara, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      color: var(--ink);
      font-family: var(--font-body);
      background: var(--water-deep);
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(120% 80% at 70% 10%, rgba(242, 201, 76, 0.22), transparent 55%),
        radial-gradient(90% 70% at 15% 85%, rgba(120, 200, 210, 0.35), transparent 50%),
        linear-gradient(165deg, #3a8a9a 0%, #2f6f7e 42%, #1e4a56 100%);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100dvh;
    }

    header {
      padding: 1.25rem 1.5rem 0.5rem;
      z-index: 2;
      animation: rise 700ms ease-out both;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--foam);
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.25);
      margin: 0;
    }

    .tagline {
      margin: 0.45rem 0 0;
      max-width: 28rem;
      color: rgba(247, 251, 252, 0.88);
      font-size: 1.05rem;
      font-weight: 600;
    }

    .status {
      margin-top: 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(247, 251, 252, 0.9);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--duck);
      box-shadow: 0 0 0 0 rgba(242, 201, 76, 0.55);
      animation: pulse 1.8s ease-out infinite;
    }
    .dot.thinking { background: #7ec8d6; animation-duration: 1s; }
    .dot.listening { background: #6fd39a; }
    .dot.error { background: #ff8b8b; animation: none; }

    #viewport {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    #viewport canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .fallback-duck {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 0;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .fallback-duck.show { display: flex; }
    .fallback-duck svg {
      width: min(52vw, 280px);
      height: auto;
      filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.28));
      animation: bob 2.8s ease-in-out infinite;
    }
    .fallback-duck.thinking svg { animation: tip 2.2s ease-in-out infinite; }
    .fallback-duck.excited svg { animation: hop 0.7s ease-in-out infinite; }

    .dock {
      position: relative;
      z-index: 2;
      padding: 0 1rem 1.1rem;
      display: grid;
      gap: 0.75rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      animation: rise 900ms 80ms ease-out both;
    }

    .stream {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 1.1rem;
      min-height: 7.5rem;
      max-height: min(28vh, 220px);
      overflow: auto;
      padding: 0.95rem 1.1rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
    }

    .stream .you, .stream .duck {
      margin: 0 0 0.65rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .stream .you { color: var(--muted); font-weight: 600; }
    .stream .duck { color: var(--ink); font-weight: 600; }
    .stream .duck .label, .stream .you .label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 0.15rem;
    }
    .stream .interim {
      opacity: 0.65;
      font-style: italic;
      margin: 0;
    }
    .stream .cursor::after {
      content: "▍
      animation: blink 1s steps(1) infinite;
      color: var(--duck-deep);
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.6rem;
      align-items: stretch;
    }

    .mic {
      appearance: none;
      border: 0;
      border-radius: 999px;
      width: 3.4rem;
      height: 3.4rem;
      background: linear-gradient(160deg, var(--duck), var(--duck-deep));
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      transition: transform 160ms ease, filter 160ms ease;
    }
    .mic:hover { transform: translateY(-1px); }
    .mic:active { transform: scale(0.97); }
    .mic.hot {
      background: linear-gradient(160deg, #6fd39a, #2f7d4a);
      color: white;
      animation: glow 1.2s ease-in-out infinite;
    }
    .mic:disabled {
      filter: grayscale(0.4) brightness(0.9);
      cursor: not-allowed;
    }

    .text-input {
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 0.85rem 1rem;
      font: inherit;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      resize: none;
      min-height: 3.4rem;
      max-height: 6rem;
    }
    .text-input:focus {
      border-color: rgba(242, 201, 76, 0.85);
      box-shadow: 0 0 0 3px rgba(242, 201, 76, 0.25);
    }

    .send {
      appearance: none;
      border: 0;
      border-radius: 1rem;
      padding: 0 1.1rem;
      background: var(--ink);
      color: var(--foam);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 160ms ease;
    }
    .send:disabled { opacity: 0.45; cursor: not-allowed; }

    .hint {
      color: rgba(247, 251, 252, 0.75);
      font-size: 0.82rem;
      text-align: center;
      margin: 0;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(242, 201, 76, 0.55); }
      70% { box-shadow: 0 0 0 10px rgba(242, 201, 76, 0); }
      100% { box-shadow: 0 0 0 0 rgba(242, 201, 76, 0); }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes tip {
      0%, 100% { transform: rotate(-8deg) translateY(0); }
      50% { transform: rotate(-14deg) translateY(-4px); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-18px) scale(1.03); }
      70% { transform: translateY(-4px) scale(0.98); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(111, 211, 154, 0.45); }
      50% { box-shadow: 0 0 0 12px rgba(111, 211, 154, 0); }
    }

    @media (max-width: 640px) {
      header { padding: 1rem 1rem 0.25rem; }
      .controls { grid-template-columns: auto 1fr; }
      .send { grid-column: 1 / -1; min-height: 2.75rem; }
      .stream { max-height: 34vh; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header>
      <h1 class="brand">Rubber Duck</h1>
      <p class="tagline">Explain your code out loud. The duck listens; your agent reasons.</p>
      <div class="status" id="status">
        <span class="dot" id="statusDot" aria-hidden="true"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </header>

    <div id="viewport" aria-hidden="true"></div>
    <div class="fallback-duck" id="fallbackDuck" aria-hidden="true">
      <svg viewBox="0 0 120 120" role="img" aria-label="Rubber duck">
        <ellipse cx="60" cy="78" rx="34" ry="22" fill="#f2c94c"/>
        <circle cx="78" cy="48" r="22" fill="#f2c94c"/>
        <ellipse cx="96" cy="50" rx="10" ry="6" fill="#e0892a"/>
        <circle cx="84" cy="44" r="3" fill="#1a2a32"/>
        <ellipse cx="48" cy="80" rx="10" ry="14" fill="#e0a92a" transform="rotate(-20 48 80)"/>
        <ellipse cx="72" cy="80" rx="10" ry="14" fill="#e0a92a" transform="rotate(20 72 80)"/>
      </svg>
    </div>

    <div class="dock">
      <div class="stream" id="stream" aria-live="polite"></div>
      <div class="controls">
        <button type="button" class="mic" id="micBtn" title="Talk to the duck" aria-pressed="false">mic</button>
        <textarea class="text-input" id="textInput" rows="1" placeholder="Or type what you’d tell the duck…"></textarea>
        <button type="button" class="send" id="sendBtn">Send</button>
      </div>
      <p class="hint" id="hint">Hold the mic or press Space to talk. Chrome/Edge work best for speech.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const STATES = ["base", "thinking", "excited"];
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const streamEl = document.getElementById("stream");
    const micBtn = document.getElementById("micBtn");
    const sendBtn = document.getElementById("sendBtn");
    const textInput = document.getElementById("textInput");
    const hint = document.getElementById("hint");
    const fallbackDuck = document.getElementById("fallbackDuck");
    const viewport = document.getElementById("viewport");

    let duckState = "base";
    let busy = false;
    let connected = false;
    let currentDuckBubble = null;
    let interimEl = null;
    let recognition = null;
    let listening = false;

    function setStatus(text, kind = "base") {
      statusText.textContent = text;
      statusDot.className = "dot" + (kind && kind !== "base" ? ` ${kind}` : "");
    }

    function setBusy(next) {
      busy = next;
      sendBtn.disabled = busy;
      micBtn.disabled = busy && !listening;
      textInput.disabled = busy;
    }

    function setDuckState(state) {
      if (!STATES.includes(state)) return;
      duckState = state;
      fallbackDuck.classList.remove("thinking", "excited");
      if (state !== "base") fallbackDuck.classList.add(state);
      if (window.__setDuckModel) window.__setDuckModel(state);
      if (state === "thinking") setStatus("Duck is thinking…", "thinking");
      else if (state === "excited") setStatus("Insight!", "base");
      else if (!busy && connected) setStatus("Ready — talk to the duck", "base");
    }

    function appendYou(text) {
      interimEl = null;
      const p = document.createElement("p");
      p.className = "you";
      p.innerHTML = `<span class="label">You</span>${escapeHtml(text)}`;
      streamEl.appendChild(p);
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function ensureDuckBubble() {
      if (currentDuckBubble) return currentDuckBubble;
      const p = document.createElement("p");
      p.className = "duck cursor";
      p.innerHTML = `<span class="label">Duck</span><span class="body"></span>`;
      streamEl.appendChild(p);
      currentDuckBubble = p.querySelector(".body");
      streamEl.scrollTop = streamEl.scrollHeight;
      return currentDuckBubble;
    }

    function appendToken(text) {
      const body = ensureDuckBubble();
      body.textContent += text;
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function finishDuckBubble() {
      if (currentDuckBubble) {
        currentDuckBubble.parentElement.classList.remove("cursor");
        currentDuckBubble = null;
      }
    }

    function showInterim(text) {
      if (!interimEl) {
        interimEl = document.createElement("p");
        interimEl.className = "interim";
        streamEl.appendChild(interimEl);
      }
      interimEl.textContent = text ? `Listening: ${text}` : "";
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function sendUtterance(text) {
      const trimmed = String(text || "").trim();
      if (!trimmed || busy) return;
      appendYou(trimmed);
      setBusy(true);
      setDuckState("thinking");
      setStatus("Sent — waiting for the agent…", "thinking");
      try {
        const res = await fetch("/utterance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: trimmed }),
        });
        if (!res.ok) throw new Error("utterance failed");
      } catch (err) {
        setStatus("Could not reach the bridge", "error");
        setBusy(false);
        setDuckState("base");
        appendToken(`(bridge error: ${err.message})`);
        finishDuckBubble();
      }
    }

    function connectSSE() {
      const es = new EventSource("/events");
      es.onopen = () => {
        connected = true;
        setStatus("Ready — talk to the duck", "base");
      };
      es.onerror = () => {
        connected = false;
        setStatus("Reconnecting to bridge…", "error");
      };
      es.onmessage = (msg) => {
        let data;
        try { data = JSON.parse(msg.data); } catch { return; }
        const { type, text } = data;
        if (type === "hello") {
          connected = true;
          setStatus("Ready — talk to the duck", "base");
          return;
        }
        if (type === "state") {
          setDuckState(text || "base");
          return;
        }
        if (type === "token") {
          setBusy(true);
          appendToken(text || "");
          return;
        }
        if (type === "done") {
          finishDuckBubble();
          if (text && STATES.includes(text)) setDuckState(text);
          else setDuckState("base");
          setBusy(false);
          setStatus("Ready — talk to the duck", "base");
          return;
        }
        if (type === "error") {
          finishDuckBubble();
          appendToken(text ? `\n(${text})` : "\n(error)");
          finishDuckBubble();
          setBusy(false);
          setDuckState("base");
          setStatus("Something went wrong", "error");
          return;
        }
        // diagram / speak: ignored in v1
      };
    }

    function setupSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        hint.textContent = "Speech recognition unavailable here — type instead. (Chrome/Edge recommended.)";
        micBtn.title = "Speech not supported";
        micBtn.disabled = true;
        return;
      }
      recognition = new SR();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = navigator.language || "en-US";

      recognition.onstart = () => {
        listening = true;
        micBtn.classList.add("hot");
        micBtn.setAttribute("aria-pressed", "true");
        setStatus("Listening…", "listening");
      };
      recognition.onend = () => {
        listening = false;
        micBtn.classList.remove("hot");
        micBtn.setAttribute("aria-pressed", "false");
        showInterim("");
        if (!busy && connected) setStatus("Ready — talk to the duck", "base");
      };
      recognition.onerror = (e) => {
        listening = false;
        micBtn.classList.remove("hot");
        if (e.error !== "aborted" && e.error !== "no-speech") {
          setStatus(`Mic: ${e.error}`, "error");
        }
      };
      recognition.onresult = (event) => {
        let interim = "";
        let finalText = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += t;
          else interim += t;
        }
        if (interim) showInterim(interim);
        if (finalText) {
          showInterim("");
          sendUtterance(finalText);
        }
      };

      const toggleMic = () => {
        if (busy) return;
        if (listening) {
          recognition.stop();
          return;
        }
        try {
          recognition.start();
        } catch {
          /* already started */
        }
      };
      micBtn.addEventListener("click", toggleMic);
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" && e.target === document.body) {
          e.preventDefault();
          toggleMic();
        }
      });
    }

    sendBtn.addEventListener("click", () => {
      const v = textInput.value;
      textInput.value = "";
      sendUtterance(v);
    });
    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    async function setupScene() {
      try {
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        viewport.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          35,
          viewport.clientWidth / Math.max(viewport.clientHeight, 1),
          0.1,
          100
        );
        camera.position.set(0.15, 1.15, 3.4);

        const hemi = new THREE.HemisphereLight(0xe8f6ff, 0x2f6f7e, 1.1);
        scene.add(hemi);
        const key = new THREE.DirectionalLight(0xfff2c9, 1.35);
        key.position.set(2.5, 4, 2);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0x8ed0e0, 0.55);
        fill.position.set(-3, 1, -1);
        scene.add(fill);

        const models = { base: null, thinking: null, excited: null };
        const root = new THREE.Group();
        scene.add(root);
        const loader = new GLTFLoader();

        async function loadOne(name) {
          const gltf = await loader.loadAsync(`/assets/duck-${name}.glb`);
          const obj = gltf.scene;
          obj.visible = false;
          obj.traverse((c) => {
            if (c.isMesh) {
              c.material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.45,
                metalness: 0.05,
              });
            }
          });
          root.add(obj);
          models[name] = obj;
        }

        await Promise.all(STATES.map(loadOne));
        models.base.visible = true;

        let bobPhase = 0;
        window.__setDuckModel = (state) => {
          for (const s of STATES) {
            if (models[s]) models[s].visible = s === state;
          }
        };

        function onResize() {
          const w = viewport.clientWidth;
          const h = viewport.clientHeight;
          camera.aspect = w / Math.max(h, 1);
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        }
        window.addEventListener("resize", onResize);

        function frame(t) {
          requestAnimationFrame(frame);
          bobPhase = t * 0.001;
          const amp = duckState === "excited" ? 0.12 : duckState === "thinking" ? 0.03 : 0.05;
          root.position.y = Math.sin(bobPhase * (duckState === "excited" ? 6 : 2.2)) * amp;
          root.rotation.y = Math.sin(bobPhase * 0.7) * 0.15;
          if (duckState === "thinking") root.rotation.z = -0.12;
          else root.rotation.z = THREE.MathUtils.lerp(root.rotation.z, 0, 0.08);
          renderer.render(scene, camera);
        }
        requestAnimationFrame(frame);
      } catch (err) {
        console.warn("WebGL/duck load failed, using fallback", err);
        fallbackDuck.classList.add("show");
        window.__setDuckModel = () => {};
      }
    }

    connectSSE();
    setupSpeech();
    setupScene();
  </script>
</body>
</html>
