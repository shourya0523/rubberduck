<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rubber Duck — Explain</title>
  <style>
    :root {
      --paper: #f3ebe0;
      --paper-deep: #cfc2ad;
      --ink: #f3ebe0;
      --ink-dark: #141816;
      --ink-soft: rgba(243, 235, 224, 0.78);
      --ink-faint: rgba(243, 235, 224, 0.52);
      --lamp: #d99a45;
      --lamp-hot: #f0bd68;
      --duck: #eab52d;
      --duck-deep: #c88e18;
      --duck-shadow: #a97212;
      --beak: #de6b2f;
      --beak-deep: #b94d1f;
      --desk: #1a211c;
      --desk-deep: #0c100e;
      --forest: #1a2e24;
      --line: rgba(243, 235, 224, 0.14);
      --ok: #2e6b4f;
      --bad: #9b3b3b;
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --font-body: "Avenir Next", Avenir, "Century Gothic", Candara, "Segoe UI", sans-serif;
      --bg-photo: url("/assets/desk-bg.webp");
      --bg-pos: 78% 36%;
      --lamp-col: minmax(9.5rem, 38%);
      --stream-max: min(30vh, 11.5rem);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      color: var(--ink);
      font-family: var(--font-body);
      overflow: hidden;
      background: var(--desk-deep);
    }

    body {
      background-color: var(--desk-deep);
      /* Lamp stays bright on the left; soft read scrim only on the right wall + desk band */
      background-image:
        linear-gradient(180deg, transparent 0%, transparent 62%, rgba(6,8,7,0.35) 78%, rgba(6,8,7,0.78) 100%),
        linear-gradient(90deg, transparent 0%, transparent 34%, rgba(8,12,10,0.22) 52%, rgba(8,12,10,0.5) 78%, rgba(8,12,10,0.58) 100%),
        radial-gradient(ellipse 46% 52% at 22% 42%, rgba(240,189,104,0.14), transparent 68%),
        var(--bg-photo);
      background-size: cover, cover, cover, cover;
      background-position: center, center, 18% 40%, var(--bg-pos);
      background-repeat: no-repeat;
      transition: filter 0.35s ease;
    }
    body.listening {
      filter: saturate(1.08) brightness(1.04);
    }

    @media (min-width: 720px) {
      :root {
        --bg-photo: url("/assets/desk-bg-wide.webp");
        --bg-pos: 62% 58%;
        --lamp-col: minmax(14rem, 40%);
        --stream-max: min(28vh, 13rem);
      }
    }

    /*
      Composition:
      - Left column = lamp clearance (photo element, no chrome)
      - Right column = brand → large duck on dark wall → streaming panel
      - Bottom band = controls on shadowed desk
    */
    .world {
      min-height: 100dvh;
      height: 100%;
      display: grid;
      grid-template-columns: var(--lamp-col) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      grid-template-areas:
        "lamp top"
        "lamp stage"
        "lamp words"
        "bottom bottom";
      position: relative;
      isolation: isolate;
      column-gap: clamp(0.25rem, 1.5vw, 1rem);
    }

    .lamp-zone {
      grid-area: lamp;
      pointer-events: none;
      z-index: 0;
    }

    .top {
      grid-area: top;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.65rem 1rem;
      padding: 1.05rem clamp(0.9rem, 2.4vw, 1.6rem) 0.15rem 0.35rem;
      animation: rise 0.6s ease both;
    }

    .brand-block {
      max-width: min(100%, 22rem);
      text-align: left;
      text-shadow: 0 2px 22px rgba(0,0,0,0.72), 0 1px 3px rgba(0,0,0,0.85);
    }

    .brand {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 4.4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.92;
      color: var(--paper);
    }

    .mode {
      margin: 0.28rem 0 0;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .phase {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.2rem;
      padding: 0.42rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--paper);
      white-space: nowrap;
      background: rgba(12, 18, 15, 0.48);
      border: 1px solid rgba(243,235,224,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }
    .phase-dot {
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: var(--ink-faint);
      flex: 0 0 auto;
    }
    .phase-dot.listening { background: var(--lamp-hot); box-shadow: 0 0 10px rgba(240,189,104,0.7); }
    .phase-dot.waiting { background: var(--ink-faint); }
    .phase-dot.error { background: var(--bad); }

    /* ————— Large duck on the dark wall patch ————— */
    .duck-stage {
      grid-area: stage;
      z-index: 1;
      min-height: 0;
      display: grid;
      place-items: center center;
      padding: 0.25rem 0.75rem 0.15rem 0.2rem;
      position: relative;
    }

    .duck {
      width: min(100%, 52vw, 440px);
      max-height: min(52vh, 460px);
      height: auto;
      overflow: visible;
      justify-self: center;
      filter: drop-shadow(0 22px 28px rgba(0,0,0,0.55));
      animation: duck-in 0.85s 0.1s ease both;
      transition: width 0.35s ease, max-height 0.35s ease;
    }
    /* While a long reply streams, keep duck readable but leave room for the panel */
    body.is-streaming .duck {
      width: min(100%, 44vw, 360px);
      max-height: min(42vh, 380px);
    }

    .duck * {
      transform-box: fill-box;
      transform-origin: center;
    }

    .duck__all { transform-origin: 50% 82%; }

    .duck.is-transition[data-state="base"] .duck__all { animation: settle 0.7s ease-out 1; }
    .duck.is-transition[data-state="thinking"] .duck__all { animation: consider 0.8s ease-out 1; }
    .duck.is-transition[data-state="excited"] .duck__all { animation: bounce 0.62s cubic-bezier(0.34, 0.8, 0.4, 1) 2; }

    .duck__head {
      transform-origin: 58% 88%;
      transition: transform 0.35s ease;
    }
    .duck[data-state="thinking"] .duck__head { transform: rotate(-9deg) translate(-2px, 3px); }
    .duck[data-state="excited"] .duck__head { transform: rotate(2deg) translateY(-3px); }
    .duck.is-listening .duck__head { transform: rotate(4deg) translate(2px, 2px); }

    .duck__beak {
      transform-origin: left center;
      transition: transform 0.25s ease;
    }
    .duck[data-state="excited"] .duck__beak { transform: scale(1.12) rotate(-4deg); }

    .duck__eye {
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .duck[data-state="thinking"] .duck__eye {
      transform: scaleY(0.14);
      opacity: 0.9;
    }

    .duck__brow {
      opacity: 0;
      transform: translateY(2px) rotate(0deg);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .duck[data-state="thinking"] .duck__brow {
      opacity: 1;
      transform: translateY(-4px) rotate(-10deg);
    }

    .duck__wing-l,
    .duck__wing-r {
      transition: transform 0.4s cubic-bezier(0.34, 0.9, 0.4, 1);
    }
    .duck__wing-l { transform-origin: 88% 30%; }
    .duck__wing-r { transform-origin: 12% 30%; }

    .duck[data-state="excited"] .duck__wing-l { transform: rotate(-38deg) translate(-6px, -10px); }
    .duck[data-state="excited"] .duck__wing-r { transform: rotate(38deg) translate(6px, -10px); }
    .duck[data-state="thinking"] .duck__wing-l { transform: rotate(6deg) translateY(2px); }

    .duck__sparkle {
      opacity: 0;
      transform: scale(0.3);
      transition: opacity 0.3s ease, transform 0.35s ease;
    }
    .duck[data-state="excited"] .duck__sparkle {
      opacity: 1;
      transform: scale(1);
    }
    .duck[data-state="excited"] .duck__sparkle--a { transition-delay: 0.05s; }
    .duck[data-state="excited"] .duck__sparkle--b { transition-delay: 0.12s; }
    .duck[data-state="excited"] .duck__sparkle--c { transition-delay: 0.19s; }

    .duck__ripple {
      fill: none;
      stroke: rgba(29, 36, 40, 0.18);
      stroke-width: 2.5;
    }
    .duck.is-transition .duck__ripple { animation: ripple 0.7s ease-out 2; }

    @keyframes settle {
      0% { transform: translateY(-7px) rotate(-1deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    @keyframes consider {
      0% { transform: translateY(0) rotate(0deg); }
      55% { transform: translateY(2px) rotate(-2.2deg); }
      100% { transform: translateY(0) rotate(-1.5deg); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-22px) scale(1.03); }
      70% { transform: translateY(-4px) scale(0.99); }
    }
    @keyframes ripple {
      0%, 100% { opacity: 0.5; transform: scaleX(1); }
      50% { opacity: 0.9; transform: scaleX(1.06); }
    }

    /* ————— Streaming panel under the duck, right of the lamp ————— */
    .words {
      grid-area: words;
      z-index: 2;
      width: 100%;
      max-width: 36rem;
      margin: 0;
      padding: 0.2rem clamp(0.85rem, 2.2vw, 1.4rem) 0.45rem 0.25rem;
      text-align: left;
      animation: rise 0.7s 0.05s ease both;
      min-height: 0;
    }

    .words-panel {
      padding: 0.8rem 0.95rem;
      border-radius: 1rem;
      background: rgba(10, 14, 12, 0.55);
      border: 1px solid rgba(243,235,224,0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.28);
      max-height: var(--stream-max);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(243,235,224,0.28) transparent;
      transition: max-height 0.3s ease, background 0.25s ease;
    }
    body.is-streaming .words-panel {
      background: rgba(10, 14, 12, 0.66);
      max-height: min(36vh, 15rem);
    }

    .invite {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.08rem, 2.1vw, 1.3rem);
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink-soft);
    }
    .invite.hide { display: none; }

    .you-block {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.18rem);
      font-weight: 600;
      line-height: 1.4;
      color: var(--paper);
      min-height: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .you-block:empty { display: none; }
    .you-block.interim {
      color: var(--ink-soft);
      font-style: italic;
      font-weight: 500;
    }

    .nudge {
      margin: 0.45rem 0 0;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink-faint);
      min-height: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .nudge:empty { display: none; margin: 0; }
    .nudge.streaming::after {
      content: " ·";
      color: var(--lamp-hot);
      animation: blink 1s steps(1) infinite;
    }

    /* ————— Bottom controls on shadowed desk edge ————— */
    .bottom {
      grid-area: bottom;
      z-index: 3;
      padding: 0.4rem 1rem 1.2rem;
      display: grid;
      justify-items: center;
      gap: 0.45rem;
      animation: rise 0.75s 0.08s ease both;
      background: linear-gradient(180deg, transparent 0%, rgba(6,8,7,0.4) 40%, rgba(6,8,7,0.7) 100%);
    }

    .hold {
      appearance: none;
      border: 0;
      width: min(92vw, 21rem);
      min-height: 3.45rem;
      padding: 0.8rem 1.2rem;
      border-radius: 999px;
      background: rgba(22, 28, 25, 0.82);
      color: var(--paper);
      border: 1px solid rgba(243,235,224,0.18);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .hold:hover { transform: translateY(-1px); }
    .hold:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .hold.armed {
      background: var(--lamp);
      color: var(--ink-dark);
      border-color: transparent;
      box-shadow:
        0 0 0 6px rgba(242, 178, 48, 0.28),
        0 12px 30px rgba(0, 0, 0, 0.28);
    }

    .hold-hint {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(243, 235, 224, 0.72);
      text-shadow: 0 1px 8px rgba(0,0,0,0.55);
    }

    .secondary {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .linkish {
      appearance: none;
      border: 0;
      background: transparent;
      color: rgba(242, 236, 224, 0.72);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 0.18em;
      cursor: pointer;
      padding: 0.2rem;
    }
    .linkish:hover { color: var(--lamp); }

    /* ————— Overlays ————— */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: rgba(29, 36, 40, 0.38);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .scrim.show { opacity: 1; pointer-events: auto; }

    .sheet, .log {
      position: fixed;
      z-index: 6;
      background: #1d2122;
      color: var(--paper);
      box-shadow: 0 -16px 48px rgba(29, 36, 40, 0.3);
      transition: transform 0.28s ease;
    }

    .sheet {
      left: 50%;
      bottom: 0;
      width: min(100%, 420px);
      transform: translate(-50%, 110%);
      border-radius: 1rem 1rem 0 0;
      padding: 0.9rem 0.9rem 1.1rem;
      display: grid;
      gap: 0.55rem;
    }
    .sheet.open { transform: translate(-50%, 0); }

    .sheet textarea {
      width: 100%;
      min-height: 5rem;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: rgba(255,255,255,0.04);
      color: var(--paper);
      font: inherit;
      font-weight: 600;
      padding: 0.75rem 0.85rem;
      outline: none;
    }
    .sheet textarea:focus { border-color: rgba(242, 178, 48, 0.8); }

    .sheet-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.45rem;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 0.65rem;
      padding: 0.55rem 0.9rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.ghost { background: transparent; color: var(--ink-soft); }
    .btn.solid { background: var(--lamp); color: var(--ink-dark); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .log {
      top: 0;
      right: 0;
      width: min(100%, 360px);
      height: 100%;
      transform: translateX(105%);
      padding: 1rem 1rem 1.25rem;
      display: grid;
      grid-template-rows: auto 1fr;
      border-left: 1px solid var(--line);
    }
    .log.open { transform: translateX(0); }

    .log h2 {
      margin: 0 2rem 0.75rem 0;
      font-family: var(--font-display);
      font-size: 1.3rem;
    }

    .log-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--paper);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .log-stream { overflow: auto; padding-right: 0.2rem; }
    .log-stream .you, .log-stream .duck {
      margin: 0 0 0.85rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .log-stream .you { color: var(--paper); }
    .log-stream .duck { color: var(--ink-soft); font-weight: 500; }
    .log-stream .label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 0.15rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes duck-in {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 720px) {
      .world {
        grid-template-columns: minmax(4.5rem, 28%) minmax(0, 1fr);
        --stream-max: min(26vh, 9.5rem);
      }
      .top { padding: 0.85rem 0.85rem 0.1rem 0.15rem; }
      .brand { font-size: clamp(1.65rem, 7.5vw, 2.15rem); }
      .duck {
        width: min(100%, 62vw, 300px);
        max-height: min(40vh, 300px);
      }
      body.is-streaming .duck {
        width: min(100%, 50vw, 240px);
        max-height: min(32vh, 240px);
      }
      .words { padding-inline: 0.65rem 0.75rem; }
      .words-panel { padding: 0.7rem 0.8rem; }
      .hold { min-height: 3.25rem; }
      :root { --bg-pos: 82% 40%; }
    }

    @media (min-width: 1100px) {
      .duck {
        width: min(100%, 38vw, 480px);
        max-height: min(56vh, 500px);
      }
      body.is-streaming .duck {
        width: min(100%, 32vw, 400px);
        max-height: min(46vh, 420px);
      }
      .words { max-width: 38rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .duck .duck__all { animation: none; }
      .duck { animation: none; transition: none; }
      .nudge.streaming::after { animation: none; }
      body.is-streaming .duck,
      .words-panel { transition: none; }
    }
  </style>
</head>
<body>
  <div class="world">
    <div class="lamp-zone" aria-hidden="true"></div>
    <header class="top">
      <div class="brand-block">
        <h1 class="brand">Rubber Duck</h1>
        <p class="mode">Explain</p>
      </div>
      <div class="phase" id="phase">
        <span class="phase-dot" id="phaseDot" aria-hidden="true"></span>
        <span id="phaseText">The duck listens</span>
      </div>
    </header>

    <main class="duck-stage" aria-label="Rubber duck">
      <svg class="duck" id="duck" data-state="base" viewBox="0 0 220 200" role="img" aria-label="Rubber duck">
        <g class="duck__all">
          <ellipse class="duck__shadow" cx="110" cy="176" rx="72" ry="10" fill="rgba(8,12,10,0.45)"/>
          <ellipse class="duck__ripple" cx="110" cy="180" rx="92" ry="12"/>

          <g class="duck__wing-l">
            <path d="M 52 108 C 30 112 22 132 34 148 C 46 160 66 158 74 146 C 80 136 74 118 62 110 Z"
              fill="var(--duck-deep)"/>
            <path d="M 50 112 C 34 116 30 132 40 144" fill="none" stroke="rgba(29,36,40,0.2)" stroke-width="3" stroke-linecap="round"/>
          </g>
          <g class="duck__wing-r">
            <path d="M 168 108 C 190 112 198 132 186 148 C 174 160 154 158 146 146 C 140 136 146 118 158 110 Z"
              fill="var(--duck-deep)"/>
            <path d="M 170 112 C 186 116 190 132 180 144" fill="none" stroke="rgba(29,36,40,0.2)" stroke-width="3" stroke-linecap="round"/>
          </g>

          <ellipse class="duck__body" cx="110" cy="138" rx="74" ry="48" fill="var(--duck)"/>
          <path d="M 110 90 C 60 90 38 116 38 138 C 38 164 70 186 110 186 C 150 186 182 164 182 138 C 182 116 160 90 110 90 Z"
            fill="var(--duck)"/>
          <path d="M 52 150 C 62 172 86 184 110 184 C 140 184 162 168 170 150 C 150 172 70 172 52 150 Z" fill="var(--duck-deep)" opacity="0.55"/>

          <g class="duck__head">
            <circle cx="128" cy="64" r="42" fill="var(--duck)"/>
            <path d="M 128 22 C 100 22 86 44 86 64 C 86 88 106 104 128 104 C 150 104 170 88 170 64 C 170 44 156 22 128 22 Z" fill="var(--duck)"/>
            <g class="duck__beak">
              <path d="M 168 66 L 196 74 C 200 75 200 81 196 83 L 168 88 Z" fill="var(--beak)"/>
              <path d="M 168 66 L 196 74 C 200 75 200 77 198 79 L 168 74 Z" fill="var(--beak-deep)" opacity="0.5"/>
            </g>
            <circle class="duck__eye" cx="146" cy="54" r="7" fill="#1d2428"/>
            <circle cx="148.5" cy="51.5" r="2.2" fill="#f2ece0" class="duck__eye-shine"/>
            <path class="duck__brow" d="M 138 42 Q 148 36 158 44" fill="none" stroke="#1d2428" stroke-width="3.5" stroke-linecap="round"/>
            <ellipse cx="110" cy="78" rx="14" ry="7" fill="rgba(255,255,255,0.28)"/>
          </g>

          <g class="duck__sparkle duck__sparkle--a">
            <path d="M 60 40 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 Z" fill="var(--duck-deep)"/>
          </g>
          <g class="duck__sparkle duck__sparkle--b">
            <path d="M 186 30 l 4 9 l 9 4 l -9 4 l -4 9 l -4 -9 l -9 -4 l 9 -4 Z" fill="var(--beak)"/>
          </g>
          <g class="duck__sparkle duck__sparkle--c">
            <path d="M 118 8 l 4 9 l 9 4 l -9 4 l -4 9 l -4 -9 l -9 -4 l 9 -4 Z" fill="var(--duck-deep)"/>
          </g>
        </g>
      </svg>
    </main>

    <section class="words" aria-live="polite">
      <div class="words-panel">
        <p class="invite" id="invite">Explain the code out loud. The duck listens.</p>
        <p class="you-block" id="youLine"></p>
        <p class="nudge" id="nudgeLine"></p>
      </div>
    </section>

    <footer class="bottom">
      <button type="button" class="hold" id="holdBtn">Hold to explain</button>
      <p class="hold-hint" id="holdHint">Press and hold · Space works too</p>
      <div class="secondary">
        <button type="button" class="linkish" id="typeOpen">Type instead</button>
        <button type="button" class="linkish" id="logOpen">Session log</button>
      </div>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="log" id="log" aria-label="Session log" hidden>
    <button type="button" class="log-close" id="logClose" aria-label="Close">×</button>
    <h2>Session</h2>
    <div class="log-stream" id="stream"></div>
  </aside>

  <div class="sheet" id="typeSheet" hidden>
    <textarea id="textInput" rows="4" placeholder="Explain what’s happening in the code…"></textarea>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="typeClose">Cancel</button>
      <button type="button" class="btn solid" id="sendBtn">Explain</button>
    </div>
  </div>

  <script>
    const STATES = ["base", "thinking", "excited"];

    const holdBtn = document.getElementById("holdBtn");
    const holdHint = document.getElementById("holdHint");
    const phaseText = document.getElementById("phaseText");
    const phaseDot = document.getElementById("phaseDot");
    const invite = document.getElementById("invite");
    const youLine = document.getElementById("youLine");
    const nudgeLine = document.getElementById("nudgeLine");
    const streamEl = document.getElementById("stream");
    const sendBtn = document.getElementById("sendBtn");
    const textInput = document.getElementById("textInput");
    const typeSheet = document.getElementById("typeSheet");
    const logEl = document.getElementById("log");
    const scrim = document.getElementById("scrim");
    const duck = document.getElementById("duck");

    let busy = false;
    let connected = false;
    let recognition = null;
    let listening = false;
    let micReady = false;
    let speechSupported = false;
    let holdPointerId = null;
    let holdRequested = false;
    let logDuckBody = null;
    let finalBuffer = "";
    let stateAnimTimer = null;
    let nudgeRenderTimer = null;

    const wordsPanel = document.querySelector(".words-panel");

    function setPhase(text, kind = "") {
      phaseText.textContent = text;
      phaseDot.className = "phase-dot" + (kind ? ` ${kind}` : "");
      document.body.classList.toggle("listening", kind === "listening");
    }

    function setBusy(next) {
      busy = next;
      sendBtn.disabled = busy;
      textInput.disabled = busy;
      if (!listening) holdBtn.disabled = busy || !speechSupported;
    }

    function setDuckState(state) {
      if (!STATES.includes(state)) return;
      if (duck.dataset.state === state) return;
      duck.dataset.state = state;
      duck.classList.remove("is-transition");
      void duck.getBoundingClientRect();
      duck.classList.add("is-transition");
      clearTimeout(stateAnimTimer);
      stateAnimTimer = setTimeout(() => {
        duck.classList.remove("is-transition");
      }, state === "excited" ? 1350 : 850);
    }

    function hideInvite() {
      invite.classList.add("hide");
    }

    function setStreaming(on) {
      document.body.classList.toggle("is-streaming", on);
    }

    function scrollWordsToEnd() {
      if (!wordsPanel) return;
      wordsPanel.scrollTop = wordsPanel.scrollHeight;
    }

    function setYouText(text, interim = false) {
      if (text) hideInvite();
      youLine.textContent = text || "";
      youLine.classList.toggle("interim", interim);
      scrollWordsToEnd();
    }

    function setNudge(text, streaming = false) {
      nudgeLine.textContent = text || "";
      nudgeLine.classList.toggle("streaming", streaming);
      setStreaming(streaming && Boolean(text));
      scrollWordsToEnd();
    }

    function appendLogYou(text) {
      const p = document.createElement("p");
      p.className = "you";
      p.innerHTML = `<span class="label">You</span>${escapeHtml(text)}`;
      streamEl.appendChild(p);
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function ensureLogDuck() {
      if (logDuckBody) return logDuckBody;
      const p = document.createElement("p");
      p.className = "duck";
      p.innerHTML = `<span class="label">Duck</span><span class="body"></span>`;
      streamEl.appendChild(p);
      logDuckBody = p.querySelector(".body");
      streamEl.scrollTop = streamEl.scrollHeight;
      return logDuckBody;
    }

    function appendLogToken(text) {
      const body = ensureLogDuck();
      body.textContent += text;
      setStreaming(true);
      if (!nudgeRenderTimer) {
        nudgeRenderTimer = setTimeout(() => {
          nudgeRenderTimer = null;
          if (logDuckBody) setNudge(logDuckBody.textContent, true);
        }, 110);
      }
      streamEl.scrollTop = streamEl.scrollHeight;
    }

    function finishLogDuck() {
      clearTimeout(nudgeRenderTimer);
      nudgeRenderTimer = null;
      if (logDuckBody) {
        setNudge(logDuckBody.textContent || "", false);
        logDuckBody = null;
      }
      nudgeLine.classList.remove("streaming");
      setStreaming(false);
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function openOverlay(el) {
      el.hidden = false;
      requestAnimationFrame(() => el.classList.add("open"));
      scrim.hidden = false;
      requestAnimationFrame(() => scrim.classList.add("show"));
    }

    function closeOverlay(el) {
      el.classList.remove("open");
      const done = () => {
        el.hidden = true;
        el.removeEventListener("transitionend", done);
      };
      el.addEventListener("transitionend", done);
      if (![typeSheet, logEl].some((x) => x.classList.contains("open") && x !== el)) {
        scrim.classList.remove("show");
        setTimeout(() => { if (!scrim.classList.contains("show")) scrim.hidden = true; }, 280);
      }
    }

    document.getElementById("typeOpen").addEventListener("click", () => {
      openOverlay(typeSheet);
      textInput.focus();
    });
    document.getElementById("typeClose").addEventListener("click", () => closeOverlay(typeSheet));
    document.getElementById("logOpen").addEventListener("click", () => openOverlay(logEl));
    document.getElementById("logClose").addEventListener("click", () => closeOverlay(logEl));
    scrim.addEventListener("click", () => {
      if (typeSheet.classList.contains("open")) closeOverlay(typeSheet);
      if (logEl.classList.contains("open")) closeOverlay(logEl);
    });

    async function sendUtterance(text) {
      const trimmed = String(text || "").trim();
      if (!trimmed || busy) return;
      closeOverlay(typeSheet);
      hideInvite();
      setYouText(trimmed, false);
      appendLogYou(trimmed);
      setNudge("");
      setBusy(true);
      setDuckState("thinking");
      setPhase("Waiting with the duck…", "waiting");
      try {
        const res = await fetch("/utterance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: trimmed }),
        });
        if (!res.ok) throw new Error("utterance failed");
      } catch (err) {
        setPhase(`Bridge offline — ${err.message}`, "error");
        setBusy(false);
        setDuckState("base");
        setNudge("(Couldn’t reach the bridge.)");
      }
    }

    function connectSSE() {
      const es = new EventSource("/events");
      es.onopen = () => {
        connected = true;
        if (!listening && !busy) setPhase("The duck listens");
      };
      es.onerror = () => {
        connected = false;
        setPhase("Reconnecting…", "error");
      };
      es.onmessage = (msg) => {
        let data;
        try { data = JSON.parse(msg.data); } catch { return; }
        const { type, text } = data;
        if (type === "hello") {
          connected = true;
          if (!listening && !busy) setPhase("The duck listens");
          return;
        }
        if (type === "state") {
          setDuckState(text || "base");
          return;
        }
        if (type === "token") {
          setBusy(true);
          setPhase("Waiting with the duck…", "waiting");
          appendLogToken(text || "");
          return;
        }
        if (type === "done") {
          finishLogDuck();
          setDuckState(text && STATES.includes(text) ? text : "base");
          setBusy(false);
          setPhase("The duck listens");
          return;
        }
        if (type === "error") {
          finishLogDuck();
          setNudge(text || "Something went wrong");
          setBusy(false);
          setDuckState("base");
          setPhase("Error", "error");
        }
      };
    }

    async function ensureMic() {
      if (micReady) return true;
      if (!navigator.mediaDevices?.getUserMedia) {
        setPhase("Mic API missing — type instead", "error");
        return false;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((t) => t.stop());
        micReady = true;
        return true;
      } catch (err) {
        setPhase(`Mic blocked (${err.name}) — type instead`, "error");
        return false;
      }
    }

    function setupSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        speechSupported = false;
        holdBtn.disabled = true;
        holdBtn.textContent = "Mic unavailable";
        holdHint.textContent = "Use Type instead (Chrome/Edge recommended)";
        return;
      }
      speechSupported = true;
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = navigator.language || "en-US";

      recognition.onstart = () => {
        if (!holdRequested) {
          recognition.stop();
          return;
        }
        listening = true;
        finalBuffer = "";
        duck.classList.add("is-listening");
        holdBtn.classList.add("armed");
        holdBtn.textContent = "Listening… release to send";
        setPhase("Listening", "listening");
      };

      recognition.onend = () => {
        const wasListening = listening;
        listening = false;
        duck.classList.remove("is-listening");
        holdBtn.classList.remove("armed");
        holdBtn.textContent = "Hold to explain";
        holdPointerId = null;
        holdRequested = false;
        if (!busy) setPhase("The duck listens");
        if (!wasListening) return;
        const toSend = finalBuffer.trim() || youLine.textContent.trim();
        finalBuffer = "";
        if (toSend) {
          setYouText(toSend, false);
          sendUtterance(toSend);
        } else {
          setYouText("", false);
        }
      };

      recognition.onerror = (e) => {
        listening = false;
        holdRequested = false;
        duck.classList.remove("is-listening");
        holdBtn.classList.remove("armed");
        holdBtn.textContent = "Hold to explain";
        if (e.error === "not-allowed") {
          setPhase("Mic permission denied — type instead", "error");
        } else if (e.error !== "aborted" && e.error !== "no-speech") {
          setPhase(`Mic: ${e.error}`, "error");
        }
      };

      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalBuffer += `${t} `;
          else interim += t;
        }
        const live = `${finalBuffer}${interim}`.trim();
        setYouText(live, Boolean(interim));
      };
    }

    async function startHold(pointerId) {
      if (busy || listening || !speechSupported) return;
      holdRequested = true;
      holdPointerId = pointerId ?? "keys";
      if (!(await ensureMic())) {
        holdRequested = false;
        holdPointerId = null;
        return;
      }
      if (!holdRequested || holdPointerId !== (pointerId ?? "keys")) return;
      try {
        recognition.start();
      } catch {
        /* already started */
      }
    }

    function stopHold(pointerId) {
      if (holdPointerId != null && pointerId != null && holdPointerId !== pointerId && holdPointerId !== "keys") {
        return;
      }
      holdRequested = false;
      if (!listening) return;
      try { recognition.stop(); } catch { /* ignore */ }
    }

    holdBtn.addEventListener("pointerdown", (e) => {
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      holdBtn.setPointerCapture?.(e.pointerId);
      startHold(e.pointerId);
    });
    holdBtn.addEventListener("pointerup", (e) => stopHold(e.pointerId));
    holdBtn.addEventListener("pointercancel", (e) => stopHold(e.pointerId));
    holdBtn.addEventListener("lostpointercapture", (e) => stopHold(e.pointerId));

    window.addEventListener("keydown", (e) => {
      if (e.code !== "Space" || e.repeat) return;
      if (e.target !== document.body && e.target !== document.documentElement && e.target !== holdBtn) return;
      e.preventDefault();
      startHold("keys");
    });
    window.addEventListener("keyup", (e) => {
      if (e.code !== "Space") return;
      e.preventDefault();
      stopHold("keys");
    });

    sendBtn.addEventListener("click", () => {
      const v = textInput.value;
      textInput.value = "";
      sendUtterance(v);
    });
    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    setupSpeech();
    connectSSE();
    setDuckState("base");
  </script>
</body>
</html>
